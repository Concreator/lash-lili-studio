<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Превью для Тильды</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f5; }
    .tilda-block { max-width: 1200px; margin: 0 auto; background: white; }
  </style>
</head>
<body>
  <div class="tilda-block">
    <iframe src="https://concreator.github.io/lash-lili-studio/" width="100%" height="800" frameborder="0" style="border:none;"></iframe>
  <script>
    window.addEventListener('load', function() {
      var iframe = document.querySelector('iframe');
      iframe.style.height = iframe.contentDocument.documentElement.scrollHeight + 'px';
    });
  </script>
  </div>
</body>
</html>
