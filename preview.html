<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Превью для Тильды</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f5; }
    .tilda-block { max-width: 1200px; margin: 0 auto; background: white; }
    iframe { display: block; width: 100%; height: 100vh; border: none; }
  </style>
</head>
<body>
  <div class="tilda-block">
    <iframe src="https://concreator.github.io/lash-lili-studio/"></iframe>
  </div>
  <script>
    window.addEventListener('message', function(e) {
      try {
        var data = JSON.parse(e.data);
        if (data.type === 'resize' && data.height) {
          document.querySelector('iframe').style.height = data.height + 'px';
        }
      } catch(err) {}
    });
  </script>
</body>
</html>
